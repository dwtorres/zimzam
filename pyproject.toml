[project]
name = "zimzam"
version = "0.0.1"
authors = [{ name = "verbena1@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "mypy>=1.14",
    "pytest-xdist>=3",
    "ipykernel",
]

[project.scripts]
main = "zimzam.main:main"
smoke = "zimzam.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]                 # notebook globals: spark, dbutils, dlt magic
"src/zimzam_etl/**" = ["F821"]       # DLT files use runtime-injected spark

[tool.mypy]
files = ["src/zimzam"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "databricks.*", "dlt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]  # integration collected only when targeted explicitly
markers = ["integration: requires a Databricks workspace"]
addopts = "-m 'not integration'"
