# The main pipeline for zimzam

resources:
  pipelines:
    zimzam_etl:
      name: zimzam_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/zimzam_etl"

      libraries:
        - glob:
            include: ../src/zimzam_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
