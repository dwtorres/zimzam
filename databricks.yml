# This is a Declarative Automation Bundle definition for zimzam.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: zimzam
  uuid: 0e110240-5c8a-4092-8de4-9bbdc9a14772

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8e058692-373e.cloud.databricks.com
    variables:
      catalog: default
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8e058692-373e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/verbena1@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/verbena1@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: default
      schema: prod
    permissions:
      - user_name: verbena1@gmail.com
        level: CAN_MANAGE
