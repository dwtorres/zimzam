# zimzam: two-lane CI/CD test bundle.
# One bundle, four targets. dev = personal sandbox; devtest/qa/prod = the lanes.
# Test rig note: all targets share one workspace (org design uses two); catalogs + root_path isolate.
bundle:
  name: zimzam
  uuid: 0e110240-5c8a-4092-8de4-9bbdc9a14772

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: UC catalog. Pinned per target; never pass --var catalog.
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8e058692-373e.cloud.databricks.com
    variables:
      catalog: zimzam_devtest
      schema: ${workspace.current_user.short_name}

  devtest:
    mode: production
    workspace:
      host: https://dbc-8e058692-373e.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/zimzam/devtest
    variables:
      catalog: zimzam_devtest
      schema: zimzam
    permissions:
      - user_name: verbena1@gmail.com
        level: CAN_MANAGE

  qa:
    mode: production
    workspace:
      host: https://dbc-8e058692-373e.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/zimzam/qa
    variables:
      catalog: zimzam_qa
      schema: zimzam
    permissions:
      - user_name: verbena1@gmail.com
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://dbc-8e058692-373e.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/zimzam/prod
    variables:
      catalog: zimzam_prod
      schema: zimzam
    permissions:
      - user_name: verbena1@gmail.com
        level: CAN_MANAGE
